name: Security advisory (manual)
description: Track an advisory that did NOT arrive via a GitHub Security Advisory (e.g. a private email report).
title: "[repo] short summary"
labels: ["advisory", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this only for reports that are **not** already GitHub Security
        Advisories. GHSAs are mirrored automatically — do not file those by hand.
  - type: input
    id: source
    attributes:
      label: Affected repo(s)
      placeholder: libparse, parse-server
    validations:
      required: true
  - type: input
    id: reporter
    attributes:
      label: Reported by / channel
      placeholder: name or email channel (do not paste secrets)
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details / reproduction
  - type: markdown
    attributes:
      value: |
        Do **not** set a `sev:*` or `status:*` label based on the reporter's
        claim — assess it yourself during triage, then apply labels.
